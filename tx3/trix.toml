[protocol]
name = "oracle-example"
scope = ""
version = "0.0.0"
description = ""
main = "main.tx3"

[registry]
url = "https://tx3.land"

[profiles.devnet]
chain = "CardanoDevnet"

[profiles.preview]
chain = "CardanoPreview"

[profiles.preprod]
chain = "CardanoPreprod"
env_file = ".env.preprod"

[profiles.mainnet]
chain = "CardanoMainnet"

[[bindings]]
output_dir = "./gen/typescript"

[bindings.template]
repo = "tx3-lang/web-sdk"
path = ".trix/client-lib"
ref = "bindgen-v1alpha2"

[[wallets]]
name = "operator"
random_key = true

[[wallets]]
name = "oracle"
random_key = true

[[wallets]]
name = "trash"
random_key = true
